[package]
name = "cce-image"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "f2bf367be09e94d88ade6debabc871d93814252b", features = ["file_dialog"] }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "ico",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
